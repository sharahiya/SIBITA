version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sibita_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sibita-network
    depends_on:
      - db

  webserver:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: sibita_webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sibita-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sibita_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sibita_db
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_PASSWORD: password123
      MYSQL_USER: sibita_user
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - sibita-network

  redis:
    image: redis:alpine
    container_name: sibita_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sibita-network

networks:
  sibita-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
